<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | CV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-body">
    <header class="hero">
        <p class="eyebrow">Contacto</p>
        <h1 class="hero-title">Formulario de contacto</h1>
        <p class="hero-subtitle">Si deseas ponerte en contacto conmigo, puedes dejar un mensaje breve y te responderé lo antes posible.</p>
    </header>
    <main class="cv-grid">
        <section class="card contact-card">
            <h2 class="section-title">Escríbeme</h2>
            <p class="section-intro">Estoy abierto a oportunidades de colaboración, preguntas o simplemente para charlar sobre temas de interés.</p>
            <form class="contact-form" action="">
                <div class="field-group">
                    <label class="field-label" for="nombre">Nombre</label>
                    <input class="field-input" type="text" id="nombre" name="nombre" required>
                </div>
                <div class="field-group">
                    <label class="field-label" for="email">Correo electrónico</label>
                    <input class="field-input" type="email" id="email" name="email" required>
                </div>
                <div class="field-group">
                    <label class="field-label" for="mensaje">Mensaje</label>
                    <textarea class="field-textarea" id="mensaje" name="mensaje" required></textarea>
                </div>
                <button class="submit-button" type="submit">Enviar</button>
            </form>
        </section>
    </main>
    <footer class="footer-bar">
        <a class="footer-link" href="index.html">Regresar al Inicio</a>
    </footer>
</body>
</html>
